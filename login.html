
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HotelPet</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f4f7;
        }

        .login-container {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            color: #214d43;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #267562;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #267562;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d5c4c;
        }

        #mensagem {
            color: #c0392b;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .rodape {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>HotelPet</h1>
        <p class="subtitulo">Entre para acessar o sistema</p>

        <form id="form-login">

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <button type="submit">Entrar</button>

            <div id="mensagem"></div>

        </form>

        <div class="rodape">
            Sistema de Gerenciamento HotelPet
        </div>

    </div>

    <script>
        if (sessionStorage.getItem("hotelpet_logado") === "sim") {
            window.location.href = "index.html";
        }

        document.getElementById("form-login").addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;
            const mensagem = document.getElementById("mensagem");

            if (
                email === "admin@hotelpet.com" &&
                senha === "123456"
            ) {
                sessionStorage.setItem("hotelpet_logado", "sim");
                window.location.href = "index.html";
            } else {
                mensagem.textContent = "E-mail ou senha incorretos!";
            }
        });
    </script>

</body>
</html>
